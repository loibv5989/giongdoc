server {
    listen 80;
    listen [::]:80;
    server_name giongdoc.solqi.net;
    return 301 https://giongdoc.solqi.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name giongdoc.solqi.net;
    ssl_certificate /etc/letsencrypt/live/giongdoc.solqi.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giongdoc.solqi.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/giongdoc.solqi.net.vhost.log;
    error_log /var/log/nginx/giongdoc.solqi.net.vhost.err;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    location ~ /\.(?:svn|git)(?:/|$) {
        access_log off;
        log_not_found off;
        return 403;
    }

    location ~* \.(env.*|sql|log)$ {
        access_log off;
        return 403;
    }

    # Native API: all websites on this VPS call loopback, without browser credentials.
    location ~ ^/(?:tts|v1|system|mcp|health|docs|redoc|openapi\.json)(?:/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:7860;
    }

    # Public pages and /web/ use the application's signed browser session gateway.
    # CORS is intentionally not enabled for other websites.
    location / {
        proxy_pass http://127.0.0.1:7860;
    }

    gzip on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types image/svg+xml text/plain text/xml text/css text/javascript application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/x-font-ttf application/vnd.ms-fontobject font/opentype font/ttf font/eot font/otf;

    client_max_body_size 128M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}
